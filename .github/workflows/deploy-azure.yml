
name: Deploy to Azure

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest Docker image..."
            sudo docker pull ghcr.io/info-ashenrsh/devops-cicd-automation:latest

            echo "Removing old container..."
            sudo docker rm -f devops-dashboard || true

            echo "Starting updated application..."
            sudo docker run -d \
              --name devops-dashboard \
              -p 3000:3000 \
              --restart unless-stopped \
              ghcr.io/info-ashenrsh/devops-cicd-automation:latest

            echo "Waiting for application to start..."
            sleep 5

            echo "Checking application health..."
            curl -fsS http://localhost:3000/health

            echo "Checking Apache reverse proxy..."
            curl -fsS http://localhost/health

            echo "Deployment completed successfully!"
